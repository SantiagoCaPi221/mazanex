apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-projects
  namespace: mazanex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-projects
  template:
    metadata:
      labels:
        app: mysql-projects
    spec:
      containers:
        - name: mysql-projects
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "db_projects"
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-projects-service
  namespace: mazanex
spec:
  selector:
    app: mysql-projects
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306