version: '3.8'

services:
  # Base de datos compartida para desarrollo local
  db:
    image: mysql:8.0
    container_name: mazanex-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mazanex_db
    ports:
      - "3306:3306"
    networks:
      - mazanex-network

  # Microservicio de Autenticación
  auth-service:
    build:
      context: ./microservicio_auth/auth
      dockerfile: Dockerfile
    container_name: mazanex-auth
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/mazanex_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - PORT=8081
    depends_on:
      - db
    networks:
      - mazanex-network

  # Microservicio de Perfil
  perfil-service:
    build:
      context: ./microservicio_perfil/perfil
      dockerfile: Dockerfile
    container_name: mazanex-perfil
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/mazanex_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - PORT=8082
    depends_on:
      - db
    networks:
      - mazanex-network

networks:
  mazanex-network:
    driver: bridge
