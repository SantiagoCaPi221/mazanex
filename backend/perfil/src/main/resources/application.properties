server.port=${PORT:8082}

# 1. Conexión a MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate (Sincronización de Base de Datos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialecto actualizado para MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 3. Límites de carga (El "Triple Candado" para Base64)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Evita que Tomcat corte la conexión en subidas pesadas
server.tomcat.max-swallow-size=10MB
# Para procesar los buffers de memoria si usas WebFlux o similar
spring.codec.max-in-memory-size=10MB

# 4. Logs de depuración (Opcional, bórralos cuando funcione)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
