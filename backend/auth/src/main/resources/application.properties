server.port=${PORT:8081}

# Conexión a MySQL (Base de datos: auth_db)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Seguridad y Logs
logging.level.org.springframework.security=DEBUG

# Ruta personalizada para la documentación (JSON)
springdoc.api-docs.path=/api-docs
# Ruta para la interfaz visual
springdoc.swagger-ui.path=/swagger-ui.html
