# ===============================
# PUERTO
# ===============================
# Railway usa PORT dinámico
# Local usa 8082
server.port=${PORT:8082}

# ===============================
# MYSQL
# ===============================
# Railway:
#   usa MYSQL_URL automáticamente
# Local:
#   usa localhost si MYSQL_URL no existe

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/mazanex_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}

spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# MULTIPART / FILES
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
spring.codec.max-in-memory-size=10MB

# ===============================
# LOGS
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
