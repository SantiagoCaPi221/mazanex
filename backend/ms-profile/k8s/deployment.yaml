apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-profile
  namespace: mazanex
  labels:
    app: ms-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-profile
  template:
    metadata:
      labels:
        app: ms-profile
    spec:
      containers:
        - name: ms-profile
          image: mazanex-ms-profile:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: profile-config
            - secretRef:
                name: mazanex-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-profile-service
  namespace: mazanex
spec:
  selector:
    app: ms-profile
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP