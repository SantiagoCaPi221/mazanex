apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-profile
  namespace: mazanex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-profile
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: ms-profile
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-profile
          image: REPLACE_WITH_REGISTRY/mazanex-ms-profile:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: mazanex-config
            - secretRef:
                name: mazanex-secrets
          env:
            - name: PORT
              value: "8082"
            - name: MYSQLDATABASE
              value: "db_profile"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: 8082
            failureThreshold: 30
            periodSeconds: 10
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ms-profile
  namespace: mazanex
spec:
  selector:
    app: ms-profile
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
