apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-profile-hpa
  namespace: mazanex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-profile
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
