# El puerto es dinámico para Railway, local usa 8082
server.port=${PORT:8082}

# 1. Conexión a MySQL (Variables de Railway con fallback a Local)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_profile}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true

spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate (¡CAMBIADO A VALIDATE PARA QUE FLYWAY TOME EL CONTROL!)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# 3. CONFIGURACIÓN DE FLYWAY (NUEVO)
# ==========================================
spring.flyway.enabled=true
# Como ya tienes tablas creadas, esto es obligatorio para que no crashee
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial Setup

# 4. Límites de carga (Optimizado para Base64)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
spring.codec.max-in-memory-size=10MB

# 5. Logs de depuración
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# 6. CONFIGURACIÓN JWT
# ==========================================
# Si estás en Railway, usa la variable de entorno. En local, usa la cadena que generaste.
jwt.secret=${JWT_SECRET:f8a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2}

# ==========================================
# 7. CONFIGURACIÓN DE CIRCUIT BREAKER (Resilience4j)
# ==========================================

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

# Instancia para proteger la llamada de sincronización hacia ms-auth
resilience4j.circuitbreaker.instances.authClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authClient.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.authClient.permittedNumberOfCallsInHalfOpenState=3

spring.cloud.compatibility-verifier.enabled=false


# clave DSN de GlitchTip
sentry.dsn=http://380c88d369e542fdb6ff5478c8723439@mazanex-glitchtip-web:8000/1

# Habilitar Performance automáticamente 
sentry.enable-tracing=true
sentry.traces-sample-rate=1.0
# Vincular el archivo de logs personalizado
logging.config=classpath:logback-spring.xml

sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info