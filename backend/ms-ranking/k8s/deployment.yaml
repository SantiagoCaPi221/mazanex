apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-ranking
  namespace: mazanex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-ranking
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: ms-ranking
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-ranking
          image: mazanex-ms-ranking:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: mazanex-config
            - secretRef:
                name: mazanex-secrets
          env:
            - name: PORT
              value: "8084"
            - name: MYSQLDATABASE
              value: "ranking_db"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            tcpSocket:
              port: 8084
            failureThreshold: 30
            periodSeconds: 10
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ms-ranking
  namespace: mazanex
spec:
  selector:
    app: ms-ranking
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
