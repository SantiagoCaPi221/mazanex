apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: mazanex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root" # Coincide con tu application.properties
            - name: MYSQL_DATABASE
              value: "db_auth" # Crea la BD vacía automáticamente
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service # ¡AQUÍ ESTÁ LA MAGIA! K8s enlazará este nombre con el MYSQLHOST de tu ConfigMap
  namespace: mazanex
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306