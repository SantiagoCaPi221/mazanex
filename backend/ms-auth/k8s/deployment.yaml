apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
  namespace: mazanex
  labels:
    app: ms-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-auth
  template:
    metadata:
      labels:
        app: ms-auth
    spec:
      containers:
        - name: ms-auth
          image: ms-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: mazanex-config
            - secretRef:
                name: auth-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-auth-service
  namespace: mazanex
spec:
  selector:
    app: ms-auth
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP