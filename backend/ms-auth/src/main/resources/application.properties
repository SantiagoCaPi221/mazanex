# El puerto es dinámico para Railway, local usa 8081
server.port=${PORT:8081}

# 1. Conexión a MySQL (Variables de Railway con fallback a Local)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_auth}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate (¡CAMBIADO A VALIDATE PARA QUE FLYWAY TOME EL CONTROL!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# 3. CONFIGURACIÓN DE FLYWAY (NUEVO)
# ==========================================
spring.flyway.enabled=false
# Como ya tienes tablas creadas, esto es obligatorio para que no crashee
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial Setup

# 4. Límites de carga (Optimizado para Base64)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
spring.codec.max-in-memory-size=10MB

# 5. Logs de depuración
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# 6. CONFIGURACIÓN JWT
# ==========================================
# Si estás en Railway, usa la variable de entorno. En local, usa la cadena que generaste.
jwt.secret=${JWT_SECRET:f8a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2}

# ==========================================
# 7. CIRCUIT BREAKER
resilience4j.circuitbreaker.instances.profileSync.register-health-indicator=true
resilience4j.circuitbreaker.instances.profileSync.sliding-window-type=COUNT_BASED
# DEPLOY_ENV: local or railway
# CB_FAILURE_RATE: umbral de fallo (porcentaje)
# CB_SLIDING_WINDOW_SIZE: tamaño de ventana deslizante
# CB_WAIT_DURATION_IN_OPEN_STATE: segundos para permanecer abierto
# CB_PERMITTED_NUMBER_OF_CALLS_IN_HALF_OPEN_STATE: llamadas permitidas en half-open
resilience4j.circuitbreaker.instances.profileSync.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.profileSync.permitted-number-of-calls-in-half-open-state=2