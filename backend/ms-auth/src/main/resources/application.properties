# El puerto es dinámico para Railway, local usa 8081
server.port=${PORT:8081}

# 1. Conexión a MySQL (Variables de Railway con fallback a Local)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_auth}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate (¡CAMBIADO A VALIDATE PARA QUE FLYWAY TOME EL CONTROL!)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# 3. CONFIGURACIÓN DE FLYWAY (NUEVO)
# ==========================================
spring.flyway.enabled=true
# Como ya tienes tablas creadas, esto es obligatorio para que no crashee
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial Setup

# 4. Límites de carga (Optimizado para Base64)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
spring.codec.max-in-memory-size=10MB

# 5. Logs de depuración
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# 6. CONFIGURACIÓN JWT
# ==========================================
# Si estás en Railway, usa la variable de entorno. En local, usa la cadena que generaste.
jwt.secret=${JWT_SECRET:f8a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2}

# ==========================================
# 7. CONFIGURACIÓN DE CIRCUIT BREAKER (Resilience4j)
# ==========================================

# Indica que los estados del CB se registren en el Actuator (para monitoreo)
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

# Definición de la instancia 'authService' (la que usarás en tus @Service)
# slidingWindowSize: Cantidad de llamadas que el CB toma en cuenta para calcular la tasa de error
resilience4j.circuitbreaker.instances.authService.slidingWindowSize=10

# failureRateThreshold: Si el 50% de las llamadas fallan, el circuito se abre
resilience4j.circuitbreaker.instances.authService.failureRateThreshold=50

# waitDurationInOpenState: Tiempo (en ms) que el circuito permanece ABIERTO antes de intentar pasar a "Semi-abierto"
resilience4j.circuitbreaker.instances.authService.waitDurationInOpenState=10000

# permittedNumberOfCallsInHalfOpenState: Cuántas llamadas permite en estado "Semi-abierto" para probar si el servicio volvió
resilience4j.circuitbreaker.instances.authService.permittedNumberOfCallsInHalfOpenState=3

spring.cloud.compatibility-verifier.enabled=false


# =====================================================================
# INTEGRACIÓN GLITCHTIP / SENTRY
# =====================================================================
sentry.dsn=http://46d70eaa568b4e4c9e37f03a2eeaf352@glitchtip:8000/1
sentry.environment=development
sentry.release=ms-auth@0.0.1-SNAPSHOT

# Muestreo de transacciones para Performance (0.1 = 10% de las peticiones HTTP)
sentry.traces-sample-rate=0.1

# Habilitar el puente entre Logback SLF4J y GlitchTip
sentry.logs.enabled=true
# Los logs desde INFO en adelante se guardan en la pestaña "Logs" de GlitchTip
sentry.logging.minimum-level=info
# Solo los logs de nivel ERROR crearán un ticket en "Issues"
sentry.logging.minimum-event-level=error
# Los logs detallados (DEBUG) se adjuntan dentro de las trazas del Issue como migas de pan
sentry.logging.minimum-breadcrumb-level=debug
sentry.debug=true 
sentry.client-name=sentry.java