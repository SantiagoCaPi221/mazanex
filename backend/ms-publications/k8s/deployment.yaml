apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-publications
  namespace: mazanex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-publications
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: ms-publications
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ms-publications
          image: REPLACE_WITH_REGISTRY/mazanex-ms-publications:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: mazanex-config
            - secretRef:
                name: mazanex-secrets
          env:
            - name: PORT
              value: "8083"
            - name: MYSQLDATABASE
              value: "publications_db"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "700m"
              memory: "768Mi"
          startupProbe:
            tcpSocket:
              port: 8083
            failureThreshold: 30
            periodSeconds: 10
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ms-publications
  namespace: mazanex
spec:
  selector:
    app: ms-publications
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
