name: CI - Profile Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'profile-service/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'profile-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./profile-service

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Ejecutar pruebas de Profile (Incluye Social)
      run: mvn clean test