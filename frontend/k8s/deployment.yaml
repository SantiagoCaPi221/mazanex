apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mazanex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mazanex-frontend:latest
        ports:
        - containerPort: 80 # Nginx suele usar el 80
        imagePullPolicy: IfNotPresent