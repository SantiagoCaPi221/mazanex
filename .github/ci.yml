      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas Publications
        run: mvn clean test

  ranking:
    name: Ranking Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend/ms-ranking

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas Ranking
        run: mvn clean test